[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snap2book"
description = "Chuyển ảnh chụp sách thành PDF gọn: làm sạch trang, OCR tiếng Việt, dàn trang lại."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pymupdf>=1.24",
    "pyobjc-framework-Vision; sys_platform == 'darwin'",  # OCR (Apple Vision)
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
snap2book = "snap2book.cli:main"

[tool.setuptools.dynamic]
version = { attr = "snap2book.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::FutureWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
